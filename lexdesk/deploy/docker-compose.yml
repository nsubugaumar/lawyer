# LexDesk on one server.
#
#   cp .env.example .env      # then fill it in (see DEPLOY.md)
#   python3 generate_keys.py >> .env
#   docker compose up -d --build
#
# Services:
#   caddy    https front door; certificates are automatic (Let's Encrypt)
#   web      the website, web app and installable phone app (Next.js)
#   api      the LexDesk API (Django + gunicorn); runs migrations on start
#   worker   sends WhatsApp / SMS / email, indexes documents
#   beat     the clock: reminders every minute, morning agendas
#   db       PostgreSQL 16
#   redis    queue and rate-limit counters

name: lexdesk

x-backend: &backend
  build: ../backend
  image: lexdesk-api:latest
  restart: unless-stopped
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    LEXDESK_VAULT_DIR: /vault
    CELERY_TASK_ALWAYS_EAGER: "0"
  volumes:
    - vault:/vault
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    build:
      context: ../web
      args:
        LEXDESK_API_ORIGIN: http://api:8000
    image: lexdesk-web:latest
    restart: unless-stopped
    depends_on:
      - api

  api:
    <<: *backend

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule
    healthcheck:
      disable: true

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  vault:
  caddy_data:
  caddy_config:
